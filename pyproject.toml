[project]
name = "sparse-portfolio-optimization"
version = "0.1.0"
description = "Cardinality-constrained portfolio selection evaluated by long-horizon wealth creation"
license = "MIT"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
    "slow: runs longer than a few seconds; excluded from the push suite",
    "net: fetches a public file (Kenneth French data library)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E501 is outside ruff's default selection; select it so the 100-column setting is enforced.
extend-select = ["E501"]
# E741 rejects l, I and O. Variables here carry the symbols of the cited papers.
# I001 wraps imports one name per line, against the compact register of these files.
ignore = ["E741", "I001"]
