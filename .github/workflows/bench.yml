name: Public benchmark cases
on:
  workflow_dispatch:
    inputs:
      cases:
        description: 'JSON array of exact public case keys'
        required: true
        default: '["g1-port1", "g2-port1-lam0.25", "f4-indtrack1", "f5-indtrack1-K3"]'
      seconds:
        description: 'Per-solve limit in seconds'
        required: true
        default: '60'
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: ${{ fromJSON(inputs.cases) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run case
        env:
          CASE: ${{ matrix.case }}
          SECONDS: ${{ inputs.seconds }}
        run: python run_bench.py --run --only "$CASE" --time "$SECONDS" --jobs 1 --missing --allow-long
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.case }}
          path: docs/results/
